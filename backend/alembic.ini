# alembic.ini — Alembic migration configuration
# Run migrations from the backend/ directory:
#   docker compose exec backend alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .

# Overridden at runtime by env.py reading DATABASE_URL env var.
# psycopg2 (sync) driver is used here — asyncpg is only for the app engine.
sqlalchemy.url = postgresql://va_user:va_dev_password_2024@postgres:5432/va_platform

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
